<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT-like Interface with HTMX and GoFiber</title>
    <script src="https://unpkg.com/htmx.org"></script>
    <style>
      body {
        font-family: "Arial", sans-serif; 
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #1e1e1e; 
        color: #f8f8f8; 
      }
      .chat-container {
       
        width: 95%;
        max-width: 900px; 
        height: 90vh;
        background-color: #2c2c2c; 
        border-radius: 12px; 
        box-shadow: 0 4px 12px rgba(255, 165, 0, 0.2); 
        display: flex;
        flex-direction: column;
        overflow-y: scroll;
         
      }
      .chat-messages {
        flex-grow: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        padding-bottom: 10px; 
      }
      .message {
        margin-bottom: 12px; 
        padding: 12px 15px; 
        border-radius: 18px; 
        max-width: 80%; 
        word-wrap: break-word; 
      }
      .user-message {
        background-color: #ff7f50; 
        color: #fff; 
        align-self: flex-end;
        margin-right: 15px;
        border-top-right-radius: 4px; 
        border-bottom-right-radius: 4px; 
      }
      .bot-message {
        background-color: #3b3b3b;
        color: #eee; 
        margin-left: 15px;
        align-self: flex-start;
        border-top-left-radius: 4px; 
        border-bottom-left-radius: 4px; 
      }
      .input-area {
        display: flex;
        padding: 15px 20px; 
        border-top: 1px solid #444; 
        background-color: #2c2c2c; 
      }
      #user-input {
        flex-grow: 1;
        padding: 12px; 
        border: 1px solid #555; 
        border-radius: 24px;
        font-size: 16px;
        background-color: #444; 
        color: #f8f8f8;
        margin-right: 10px; 
      }
      #user-input::placeholder {
        color: #999; 
      }
      #send-button {
        padding: 12px 25px; 
        background-color: #ff9800;
        color: #fff;
        border: none;
        border-radius: 24px; 
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s ease; 
      }
      #send-button:hover {
        background-color: #ffb347; 
      }
      #send-button:active {
        background-color: #ff7f00;
      }
      #loading {
        content: "...";
        color: #ff9800; 
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div
        class="chat-messages"
        id="chat-messages"
        hx-indicator="#loading"
      ></div>
      <form
        class="input-area"
        hx-post="/send-message"
        hx-target="#chat-messages"
        hx-swap="beforebegin"
      >
        <input
          type="text"
          id="user-input"
          name="message"
          placeholder="Type your message here..."
          required
        />
        <button type="submit" id="send-button">Send</button>
      </form>
    </div>
  </body>
</html>
